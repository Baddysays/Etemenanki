name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          modules: 'qtcharts qtnetworkauth'
          arch: 'win64_msvc2022_64'

      - name: Build Release
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          windeployqt build/Release/Etemenanki.exe --qmldir qml_cpp

      - name: Inno Setup
        run: |
          choco install innosetup -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer/EtemenankiSetup.iss
          Copy-Item installer/dist/EtemenankiSetup-*.exe installer/dist/etemenanki-setup.exe

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: installer/dist/etemenanki-setup.exe
          generate_release_notes: true
