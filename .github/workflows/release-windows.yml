name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v1.0.1)"
        required: true
        default: "v1.0.5"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', github.event.inputs.tag) || github.ref }}

      - name: Install Qt 6.8
        id: qt1
        uses: jurplel/install-qt-action@v4
        continue-on-error: true
        with:
          version: "6.8.0"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtpdf
          cache: true

      - name: Install Qt 6.8 (retry)
        id: qt2
        if: steps.qt1.outcome == 'failure'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.0"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtpdf
          cache: true

      - name: Verify Qt install
        shell: pwsh
        run: |
          if ("${{ steps.qt1.outcome }}" -ne "success" -and "${{ steps.qt2.outcome }}" -ne "success") {
            throw "Qt installation failed after two attempts"
          }

      - name: Configure and build
        env:
          CMAKE_PREFIX_PATH: ${{ env.QT_ROOT_DIR }}/lib/cmake
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          if (-not (Test-Path "build/Release/Etemenanki.exe")) {
            throw "Etemenanki.exe not found after build"
          }

      - name: Prepare release bundle (Python + embedded model)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          & ./scripts/prepare_release.ps1 -BuildDir "build/Release"
          $prepCode = $LASTEXITCODE
          $gguf = Get-ChildItem -Path "build/Release/engines/llm/models" -Filter "*.gguf" -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $gguf) {
            throw "Embedded model missing after prepare_release (exit $prepCode) — installer would be incomplete"
          }
          Write-Host "Model ready: $($gguf.Name) ($([math]::Round($gguf.Length / 1GB, 2)) GB)"
          # Model is required; llama-cpp-python is best-effort (wheels may be missing on CI)
          if ($prepCode -ne 0) {
            Write-Host "WARNING: prepare_release exit=$prepCode but model is present — continuing"
          }

      - name: Deploy Qt runtime (windeployqt)
        run: |
          $windeployqt = Join-Path $env:QT_ROOT_DIR "bin/windeployqt.exe"
          if (-not (Test-Path $windeployqt)) { throw "windeployqt not found: $windeployqt" }
          $prev = $ErrorActionPreference
          $ErrorActionPreference = "Continue"
          & $windeployqt "build/Release/Etemenanki.exe" --qmldir "qml_cpp" --no-translations 2>&1 | ForEach-Object { Write-Host $_ }
          $ErrorActionPreference = $prev
          # Drop debug QML tooling plugins if present
          Remove-Item -Recurse -Force "build/Release/qmltooling" -ErrorAction SilentlyContinue
          Get-ChildItem "build/Release" -Recurse -Directory -Filter "__pycache__" -ErrorAction SilentlyContinue |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

      - name: Portable ZIP (app only, no GGUF — stays under 2 GiB)
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "ete-portable"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "build/Release/*" $stage -Recurse -Force
          Get-ChildItem $stage -Recurse -Filter "*.gguf" -ErrorAction SilentlyContinue | Remove-Item -Force
          Compress-Archive -Path "$stage\*" -DestinationPath "etemenanki-portable.zip" -Force
          $z = Get-Item "etemenanki-portable.zip"
          Write-Host "Portable ZIP: $([math]::Round($z.Length / 1MB, 1)) MiB (model not included — use full installer)"

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after choco install" }
          New-Item -ItemType Directory -Force -Path "installer/dist" | Out-Null
          & $iscc "installer/EtemenankiSetup.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compile failed with code $LASTEXITCODE" }
          $built = Get-ChildItem "installer/dist/EtemenankiSetup-*.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $built) { throw "EtemenankiSetup-*.exe not found in installer/dist" }
          $ver = "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}" -replace '^v',''
          $setupName = "EtemenankiSetup-$ver.exe"
          Copy-Item $built.FullName $setupName -Force
          # Alias for older update clients
          Copy-Item $built.FullName "etemenanki-setup.exe" -Force
          $sizeGb = [math]::Round($built.Length / 1GB, 2)
          Write-Host "Installer: $setupName ($sizeGb GiB)"
          $limit = 2GB - 32MB  # leave headroom under GitHub hard limit
          if ($built.Length -gt $limit) {
            throw "Installer too large for GitHub Releases: $sizeGb GiB (limit ~1.97 GiB). Use a smaller GGUF quant."
          }

      - name: Write update.json for this release
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
        run: |
          $ver = $env:TAG -replace '^v',''
          $parts = $ver.Split('.')
          $code = 100
          if ($parts.Count -ge 3) {
            $code = [int]$parts[0] * 10000 + [int]$parts[1] * 100 + [int]$parts[2]
          }
          $obj = @{
            version_code = $code
            version_name = $ver
            setup_url = "https://github.com/Baddysays/Etemenanki/releases/download/$env:TAG/EtemenankiSetup-$ver.exe"
            portable_url = "https://github.com/Baddysays/Etemenanki/releases/download/$env:TAG/etemenanki-portable.zip"
            release_notes = "Release $env:TAG — see GitHub release notes."
            mandatory = $false
          }
          $obj | ConvertTo-Json | Set-Content -Encoding utf8 releases/update.json

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
        run: |
          $ver = $env:TAG -replace '^v',''
          $setupName = "EtemenankiSetup-$ver.exe"
          if (-not (Test-Path $setupName)) { throw "Missing $setupName" }
          if (-not (Test-Path "etemenanki-portable.zip")) { throw "Missing etemenanki-portable.zip" }
          if (-not (Test-Path "releases/update.json")) { throw "Missing releases/update.json" }

          $existing = gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Updating existing release $env:TAG"
            gh release upload $env:TAG $setupName etemenanki-setup.exe etemenanki-portable.zip releases/update.json --clobber
          } else {
            Write-Host "Creating release $env:TAG"
            gh release create $env:TAG $setupName etemenanki-setup.exe etemenanki-portable.zip releases/update.json `
              --title "Etemenanki $env:TAG" `
              --generate-notes
          }
