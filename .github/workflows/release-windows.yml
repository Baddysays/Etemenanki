name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v1.0.1)"
        required: true
        default: "v1.0.2"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', github.event.inputs.tag) || github.ref }}

      - name: Install Qt 6.8
        id: qt1
        uses: jurplel/install-qt-action@v4
        continue-on-error: true
        with:
          version: "6.8.0"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtpdf
          cache: true

      - name: Install Qt 6.8 (retry)
        id: qt2
        if: steps.qt1.outcome == 'failure'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.0"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtpdf
          cache: true

      - name: Verify Qt install
        shell: pwsh
        run: |
          if ("${{ steps.qt1.outcome }}" -ne "success" -and "${{ steps.qt2.outcome }}" -ne "success") {
            throw "Qt installation failed after two attempts"
          }

      - name: Configure and build
        env:
          CMAKE_PREFIX_PATH: ${{ env.QT_ROOT_DIR }}/lib/cmake
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          if (-not (Test-Path "build/Release/Etemenanki.exe")) {
            throw "Etemenanki.exe not found after build"
          }

      - name: Deploy Qt runtime (windeployqt)
        run: |
          $windeployqt = Join-Path $env:QT_ROOT_DIR "bin/windeployqt.exe"
          if (-not (Test-Path $windeployqt)) { throw "windeployqt not found: $windeployqt" }
          $prev = $ErrorActionPreference
          $ErrorActionPreference = "Continue"
          & $windeployqt "build/Release/Etemenanki.exe" --qmldir "qml_cpp" 2>&1 | ForEach-Object { Write-Host $_ }
          $ErrorActionPreference = $prev

      - name: Portable ZIP
        run: |
          Compress-Archive -Path "build/Release/*" -DestinationPath "etemenanki-portable.zip" -Force

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after choco install" }
          New-Item -ItemType Directory -Force -Path "installer/dist" | Out-Null
          & $iscc "installer/EtemenankiSetup.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compile failed with code $LASTEXITCODE" }
          $built = Get-ChildItem "installer/dist/EtemenankiSetup-*.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $built) { throw "EtemenankiSetup-*.exe not found in installer/dist" }
          Copy-Item $built.FullName "etemenanki-setup.exe" -Force
          Write-Host "Installer: etemenanki-setup.exe ($([math]::Round($built.Length / 1048576, 1)) MiB)"

      - name: Write update.json for this release
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
        run: |
          $ver = $env:TAG -replace '^v',''
          $parts = $ver.Split('.')
          $code = 100
          if ($parts.Count -ge 3) {
            $code = [int]$parts[0] * 10000 + [int]$parts[1] * 100 + [int]$parts[2]
          }
          $obj = @{
            version_code = $code
            version_name = $ver
            setup_url = "https://github.com/Baddysays/Etemenanki/releases/download/$env:TAG/etemenanki-setup.exe"
            portable_url = "https://github.com/Baddysays/Etemenanki/releases/download/$env:TAG/etemenanki-portable.zip"
            release_notes = "Release $env:TAG — see GitHub release notes."
            mandatory = $false
          }
          $obj | ConvertTo-Json | Set-Content -Encoding utf8 releases/update.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          name: Etemenanki ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            etemenanki-portable.zip
            etemenanki-setup.exe
            releases/update.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
