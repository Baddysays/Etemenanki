name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', github.event.inputs.tag) || github.ref }}

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.0"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtquickcontrols2 qtpdf qtpdfquick qtshadertools

      - name: Configure and build
        env:
          CMAKE_PREFIX_PATH: ${{ env.QT_ROOT_DIR }}/lib/cmake
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Portable ZIP
        run: |
          if (-not (Test-Path "build/Release/EtemenankiQt.exe")) {
            throw "EtemenankiQt.exe not found after build"
          }
          Compress-Archive -Path "build/Release/*" -DestinationPath "etemenanki-portable.zip" -Force

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            & $iscc "installer/EtemenankiSetup.iss"
            $built = Get-ChildItem "installer/dist/EtemenankiSetup-*.exe" | Select-Object -First 1
            if ($built) {
              Copy-Item $built.FullName "etemenanki-setup.exe" -Force
            }
          }
          if (-not (Test-Path "etemenanki-setup.exe")) {
            Write-Warning "Installer not built — release will ship portable ZIP only"
          }

      - name: Write update.json for this release
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
        run: |
          $ver = $env:TAG -replace '^v',''
          $parts = $ver.Split('.')
          $code = 100
          if ($parts.Count -ge 3) {
            $code = [int]$parts[0] * 10000 + [int]$parts[1] * 100 + [int]$parts[2]
          }
          $obj = @{
            version_code = $code
            version_name = $ver
            setup_url = "https://github.com/Baddysays/Etemenanki/releases/download/$env:TAG/etemenanki-setup.exe"
            portable_url = "https://github.com/Baddysays/Etemenanki/releases/download/$env:TAG/etemenanki-portable.zip"
            release_notes = "Release $env:TAG — see GitHub release notes."
            mandatory = $false
          }
          $obj | ConvertTo-Json | Set-Content -Encoding utf8 releases/update.json

      - name: Collect release files
        run: |
          $files = @("etemenanki-portable.zip", "releases/update.json")
          if (Test-Path "etemenanki-setup.exe") { $files += "etemenanki-setup.exe" }
          "RELEASE_FILES=$($files -join ',')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          name: Etemenanki ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            etemenanki-portable.zip
            etemenanki-setup.exe
            releases/update.json
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
